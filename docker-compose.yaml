services:
  postgres:
    image: postgres:16
    container_name: business-platforma-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5437:5432"
    volumes:
      - postgres_dataT:/var/lib/postgresql/data

volumes:
  postgres_dataT: